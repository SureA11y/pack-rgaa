<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rgaa-field-hidden-label-review — scenario fixture</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height: 1.4; margin: 24px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    h2 { font-size: 16px; margin: 22px 0 10px; }
    .note { font-size: 12px; opacity: 0.85; margin: 8px 0 16px; }
    .case { border: 1px solid #ddd; border-radius: 10px; padding: 12px; margin: 10px 0; }
    .case-title { font-weight: 700; margin: 0 0 8px; }
  </style>
</head>
<body>
  <h1>Scenario fixture: <code>rgaa-field-hidden-label-review</code> (RGAA 11.1.3)</h1>

  <p class="note">
    Each target has a stable <code>id</code> of the form <code>fhl_case_NN</code>.
    A field whose label is not visible needs a title or visible text next to it.
  </p>

  <div class="case" id="case_01">
    <div class="case-title">01 — CANTTELL: a search field whose label is visually hidden</div>
    <form><label for="fhl_case_01" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Rechercher</label><input id="fhl_case_01"><button>OK</button></form>
  </div>

  <div class="case" id="case_02">
    <div class="case-title">02 — NOT APPLICABLE: a visible label</div>
    <form><label for="fhl_case_02">Nom</label><input id="fhl_case_02"></form>
  </div>
</body>
</html>
