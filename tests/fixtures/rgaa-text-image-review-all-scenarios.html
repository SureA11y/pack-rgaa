<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>rgaa-text-image-review — scenario fixture</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height: 1.4; margin: 24px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    h2 { font-size: 16px; margin: 22px 0 10px; }
    .note { font-size: 12px; opacity: 0.85; margin: 8px 0 16px; }
    .case { border: 1px solid #ddd; border-radius: 10px; padding: 12px; margin: 10px 0; }
    .case-title { font-weight: 700; margin: 0 0 8px; }
  </style>
</head>
<body>
  <h1>Scenario fixture: <code>rgaa-text-image-review</code> (RGAA 1.8.1, 1.8.2)</h1>

  <p class="note">
    Each target has a stable <code>id</code> of the form <code>tir_case_NN</code>.
    Images likely to show text are asked about; logos are not.
  </p>

  <div class="case" id="case_01">
    <div class="case-title">01 — CANTTELL: an image button</div>
    <form><input type="image" id="tir_case_01" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" alt="Rechercher" width="80" height="30"></form>
  </div>

  <div class="case" id="case_02">
    <div class="case-title">02 — CANTTELL: an image inside a heading</div>
    <h2><img id="tir_case_02" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" alt="Nos engagements" width="300" height="40"></h2>
  </div>

  <div class="case" id="case_03">
    <div class="case-title">03 — NOT APPLICABLE: a logo</div>
    <a href="/"><img id="tir_case_03" class="site-logo" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" alt="Mairie de Lyon" width="200" height="60"></a>
  </div>
</body>
