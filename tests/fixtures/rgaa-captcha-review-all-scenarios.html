<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rgaa-captcha-review — scenario fixture</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height: 1.4; margin: 24px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    h2 { font-size: 16px; margin: 22px 0 10px; }
    .note { font-size: 12px; opacity: 0.85; margin: 8px 0 16px; }
    .case { border: 1px solid #ddd; border-radius: 10px; padding: 12px; margin: 10px 0; }
    .case-title { font-weight: 700; margin: 0 0 8px; }
  </style>
</head>
<body>
  <h1>Scenario fixture: <code>rgaa-captcha-review</code> (RGAA 1.4, 1.5)</h1>

  <p class="note">
    Each target has a stable <code>id</code> of the form <code>cpr_case_NN</code>.
    CAPTCHA images and widgets are asked about.
  </p>

  <div class="case" id="case_01">
    <div class="case-title">01 — CANTTELL: a CAPTCHA image</div>
    <form><img id="cpr_case_01" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" alt="Image CAPTCHA" width="120" height="40"><label for="code">Code</label><input id="code"></form>
  </div>

  <div class="case" id="case_02">
    <div class="case-title">02 — CANTTELL: a reCAPTCHA widget</div>
    <form><div id="cpr_case_02" class="g-recaptcha" data-sitekey="x" style="width:300px;height:80px"></div></form>
  </div>

  <div class="case" id="case_03">
    <div class="case-title">03 — NOT APPLICABLE: an ordinary image</div>
    <img id="cpr_case_03" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" alt="La mairie" width="120" height="40">
  </div>
</body>
</html>
