name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # The npm release.yml publishes with, so a test can't pass here and fail
      # there. It needs Node 22 or later; on Node 20 the job keeps its own npm.
      - if: matrix.node-version != '20.x'
        run: npm install -g npm@12
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 5
      # Locally a test samples the scenario pages; here, on one Node version,
      # it scans them all.
      - run: npm test
        env:
          RGAA_FULL_TESTS: ${{ matrix.node-version == '22.x' && '1' || '' }}
